name: GitOps CD - Dev ECR

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "mvnw"
      - ".mvn/**"
      - ".github/workflows/gitops-ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: gitops-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::185188589391:role/ai-bankapp-dev-github-actions-ecr
  ECR_REPOSITORY: ai-bankapp-dev

jobs:
  build-push-update:
    name: Build, push, and update dev manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify with Maven
        run: ./mvnw clean verify -B -ntp

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: bankapp-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        shell: bash
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${SHA_SHORT}"
          echo "sha_short=${SHA_SHORT}" >> "${GITHUB_OUTPUT}"
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes deployment manifest
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          sed -i -E "s#(^[[:space:]]*image:[[:space:]]*)[^[:space:]]*/ai-bankapp-dev:[^[:space:]]+#\1${IMAGE_URI}#" k8s/bankapp-deployment.yml
          grep -F "image: ${IMAGE_URI}" k8s/bankapp-deployment.yml

      - name: Commit manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/bankapp-deployment.yml
          if git diff --staged --quiet; then
            echo "Manifest already references this image."
            exit 0
          fi
          git commit -m "ci: deploy dev image ${{ steps.image.outputs.sha_short }} [skip ci]"
          git push origin HEAD:dev
