apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bankapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chauhan050790/AI-BankApp-DevOps-project.git
    targetRevision: dev
    path: k8s
    directory:
      # Enable availability.yml after installing the Prometheus Operator.
      # ingress.yml is the legacy ALB path; enabling it would create a second
      # public load balancer alongside the Envoy Gateway NLB.
      exclude: "{availability.yml,ingress.yml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: bankapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
