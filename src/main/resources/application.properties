spring.application.name=bankapp

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bankappdb}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# Schema changes are versioned under db/migration. Hibernate only verifies them.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Store authenticated sessions in the database so replicas do not require sticky routing.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:30m}

# Virtual threads (Java 21)
spring.threads.virtual.enabled=true

# Graceful shutdown and conservative error responses
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Actuator runs on an internal-only port in Kubernetes.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}

# Ollama AI
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:tinyllama}
ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:2s}
ollama.read-timeout=${OLLAMA_READ_TIMEOUT:20s}

# Business and password-hardening limits
bankapp.max-transaction-amount=${MAX_TRANSACTION_AMOUNT:1000000.00}
bankapp.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Structured logging
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n
