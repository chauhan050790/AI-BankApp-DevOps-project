apiVersion: v1
kind: ConfigMap
metadata:
  name: bankapp-config
  namespace: bankapp
data:
  MYSQL_HOST: mysql-service
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: bankappdb
  MYSQL_SSL_MODE: REQUIRED
  OLLAMA_URL: http://ollama-service:11434
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  # The current dev Gateway exposes HTTP only. Change this back to "true"
  # in the same rollout that enables HTTPS.
  SESSION_COOKIE_SECURE: "false"
