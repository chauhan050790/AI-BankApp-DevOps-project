apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bankapp
  namespace: bankapp
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: bankapp
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
